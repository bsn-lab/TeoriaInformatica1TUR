<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informatica - Teoria Primo Trimestre</title>
<style>
:root{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#13203B;--muted:#55617A;--line:#D7DDE8;--accent:#2347D6;--accent-ink:#FFFFFF;--bad:#BF3328}
@media (prefers-color-scheme: dark){:root{--bg:#0D1322;--surface:#161F35;--ink:#E8EDF7;--muted:#A1ACC2;--line:#28334D;--accent:#8AA2FF;--accent-ink:#0D1322;--bad:#FF8379;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.mark{width:14px;height:14px;background:var(--accent);border-radius:3px}
h1{margin:0;font-size:22px;line-height:1.2}
p{margin:0;color:var(--muted);font-size:15px}
label{font-weight:700;font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font:inherit;font-weight:700;font-size:16px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-weight:700;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="mark"></div>
  <h1>Informatica - Teoria Primo Trimestre</h1>
  <p>Contenuto riservato. Inserisci la password per aprire le lezioni.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" required autofocus>
  <label class="rem" for="rem"><input type="checkbox" id="rem"> Ricorda su questo dispositivo</label>
  <button id="go" type="submit">Apri</button>
  <p class="err" id="err" role="alert"></p>
  <noscript><p class="err">Per aprire la pagina serve JavaScript attivo.</p></noscript>
</form>

const KEY="ic-key";
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(DATA.s),iterations:DATA.n,hash:"SHA-256"},base,256));
}
async function open_(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(DATA.i)},key,u8(DATA.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f=document.getElementById("f"), err=document.getElementById("err"), go=document.getElementById("go");
if(!window.crypto||!crypto.subtle){ err.textContent="Questo browser non supporta la decifratura. Apri la pagina da un indirizzo https."; go.disabled=true }
(async()=>{ try{ const k=localStorage.getItem(KEY); if(k) show(await open_(u8(k))) }catch(e){ try{localStorage.removeItem(KEY)}catch(_){} } })();
f.addEventListener("submit",async e=>{
  e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="Apertura…";
  try{
    const remember=document.getElementById("rem").checked;
    const raw=await derive(document.getElementById("pw").value);
    const html=await open_(raw);
    if(remember) try{ localStorage.setItem(KEY,btoa(String.fromCharCode(...raw))) }catch(_){}
    show(html);
  }catch(x){ err.textContent="Password errata. Riprova."; go.disabled=false; go.textContent="Apri" }
});
})();
